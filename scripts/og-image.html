<!doctype html>
<!--
  Fuente de public/og.png (la vista previa al compartir el enlace).
  Para regenerarla: abre este archivo en Chrome con la ventana a 1200×630
  y toma una captura, o usa cualquier herramienta de capturas a ese tamaño.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@600;700&display=swap"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        font-family: 'Inter', sans-serif;
        color: #fff;
        background: linear-gradient(135deg, #06120e 0%, #0b1f19 55%, #123a2e 100%);
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .glow { position: absolute; right: -120px; top: -80px; width: 720px; height: 720px; background: radial-gradient(closest-side, rgba(16,185,129,.35), transparent); }
      canvas { position: absolute; inset: 0; }
      .content { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 340px; gap: 56px; align-items: center; padding: 64px 72px; }
      .logo { display: flex; align-items: center; gap: 14px; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 600; margin-bottom: 36px; }
      .mark { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #059669, #047857 55%, #065f46); }
      .logo b { color: #6ee7b7; font-weight: 600; }
      .pill { display: inline-flex; align-items: center; gap: 12px; padding: 9px 18px 9px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); font-size: 20px; }
      .pill i { width: 12px; height: 12px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.2); }
      h1 { margin: 26px 0 16px; font-family: 'Outfit', sans-serif; font-size: 56px; line-height: 1.04; letter-spacing: -.035em; font-weight: 600; }
      h1 span { display: block; background: linear-gradient(100deg, #8ff0c6, #34d399 70%, #10b981); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .role { font-size: 24px; color: rgba(255,255,255,.75); }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
      .chips span { font-family: 'JetBrains Mono', monospace; font-size: 17px; padding: 7px 13px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.85); }
      .photo { width: 340px; height: 340px; padding: 8px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #047857 55%, #065f46); box-shadow: 0 40px 90px -30px rgba(16,185,129,.9); }
      .photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
      .url { position: absolute; right: 72px; bottom: 40px; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: rgba(255,255,255,.6); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <canvas id="rain" width="1200" height="630"></canvas>
    <div class="content">
      <div>
        <div class="logo"><span class="mark">JY</span><span>javier<b>.yunga</b></span></div>
        <span class="pill"><i></i>Disponible para roles Full Stack Semi Senior</span>
        <h1><span>Javier Yunga</span>Software que resuelve problemas reales de negocio.</h1>
        <p class="role">Ingeniero en Ciencias de la Computación · 4+ años</p>
        <div class="chips"><span>Spring Boot</span><span>NestJS</span><span>Django</span><span>React</span><span>Redis</span><span>AWS</span></div>
      </div>
      <div class="photo"><img src="../public/foto.png" alt="" /></div>
    </div>
    <p class="url">javieryungat.github.io</p>
    <script>
      // Lluvia de código estática en la mitad derecha, igual que en el sitio.
      const ctx = document.getElementById('rain').getContext('2d');
      const tokens = ['const', '=>', 'SELECT', 'await', 'git push', 'JWT', '200 OK', 'SRI', 'docker', 'Spring', 'REST', 'AWS', 'Redis', 'commit'];
      ctx.font = '15px "JetBrains Mono", monospace';
      for (let x = 620; x < 1200; x += 96) {
        const top = Math.random() * 300;
        for (let k = 0; k < 9; k++) {
          ctx.fillStyle = `rgba(110,231,183,${k === 0 ? 0.55 : Math.max(0.04, 0.22 - k * 0.025)})`;
          ctx.fillText(tokens[Math.floor(Math.random() * tokens.length)], x, top + 300 - k * 26);
        }
      }
    </script>
  </body>
</html>
